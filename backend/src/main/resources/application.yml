server:
  port: 8080

spring:
  application:
    name: art-decor-workforce-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artdecor_workforce}
    username: ${DB_USERNAME:artdecor}
    password: ${DB_PASSWORD:artdecor_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  business-zone: ${APP_BUSINESS_ZONE:Europe/Berlin}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:Art Decor Administrator}
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@artdecor.local}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    employee-name: ${APP_BOOTSTRAP_EMPLOYEE_NAME:Demo Employee}
    employee-code: ${APP_BOOTSTRAP_EMPLOYEE_CODE:EMP001}
    employee-pin: ${APP_BOOTSTRAP_EMPLOYEE_PIN:1234}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-very-long-production-value}
    jwt-issuer: art-decor-events
    access-token-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*,http://172.17.*.*:*,http://172.18.*.*:*,http://172.19.*.*:*,http://172.20.*.*:*,http://172.21.*.*:*,http://172.22.*.*:*,http://172.23.*.*:*,http://172.24.*.*:*,http://172.25.*.*:*,http://172.26.*.*:*,http://172.27.*.*:*,http://172.28.*.*:*,http://172.29.*.*:*,http://172.30.*.*:*,http://172.31.*.*:*}"
  management:
    allow-force-employee-delete: ${APP_ALLOW_FORCE_EMPLOYEE_DELETE:false}
